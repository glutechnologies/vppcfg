defaults:
  rx-mode: interrupt

interfaces:
  GigabitEthernet1/0/0:
    lcp: "e0"
    sub-interfaces:
      100:
        lcp: "e0.100"
  GigabitEthernet1/0/1:
    rx-mode: polling
  GigabitEthernet1/0/2:
    description: "A bond member"
  BondEthernet0:
    lcp: "bond0"
  BondEthernet1:
    description: "A bond without an LCP: nothing receives"
  tap100:
    description: "A TAP"

bondethernets:
  BondEthernet0:
    interfaces: [ GigabitEthernet1/0/2 ]
  BondEthernet1:
    interfaces: []

taps:
  tap100:
    host:
      name: vpp-tap100

loopbacks:
  loop0:
    lcp: "lo0"
  loop1:
    description: "No LCP: nothing receives"
  loop2:
    lcp: "lo2"
    rx-mode: adaptive
